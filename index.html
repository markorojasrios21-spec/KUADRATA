    <script>
      // Antes del primer pintado: marca JS y decide si hay preloader (solo primera visita, sin reduced-motion).
      // Red de seguridad: si el bundle no arranca en 7 s, el contenido nunca queda oculto.
      (function (d) {
        var h = d.documentElement
        h.classList.add('js')
        try {
          if (!sessionStorage.getItem('kdrt-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) h.classList.add('preloading')
        } catch (e) {}
        window.__kdrtGuard = setTimeout(function () { h.classList.remove('js', 'preloading') }, 7000)
      })(document)
    </script>
